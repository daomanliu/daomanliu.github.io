# GitHub Actions 自动部署博客到 GitHub Pages
# 触发条件：推送到 main 分支（包括只改 public/posts/ 下的文章）
# 一次性设置：仓库 Settings → Pages → Source 选择 "GitHub Actions"
name: Deploy Blog

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # build 前会自动执行 prebuild：扫描 public/posts/ 生成 posts.json 索引
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
